<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrator Login | Autonix</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f6fa;background:#090b10;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#090b10}
    .login{width:min(420px,100%);padding:34px;border:1px solid #29313e;border-radius:14px;background:#11151d;box-shadow:0 24px 64px rgba(0,0,0,.4)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.brand-mark{width:42px;height:42px;border-radius:11px;background:#e8002d;display:grid;place-items:center;font-weight:800;color:#fff}
    h1{font-size:22px;margin:0;letter-spacing:-.03em}p{color:#9aa5b5;font-size:13px}label{display:block;margin:16px 0 7px;font-size:13px;font-weight:650}input{width:100%;min-height:46px;padding:12px 14px;border:1px solid #343d4b;border-radius:9px;background:#0c1017;color:white;outline:none}
    input:focus{border-color:#e8002d;box-shadow:0 0 0 3px rgba(232,0,45,.15)}button{width:100%;min-height:46px;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#e8002d;color:white;font-weight:700;cursor:pointer;transition:background .16s ease}button:hover{background:#c90027}button:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:2px solid #ff8296;outline-offset:3px}.error{color:#ff8296;min-height:20px;margin:12px 0 0;font-size:13px;line-height:1.5}
    @media(max-width:420px){.login{padding:26px 22px}}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><div class="brand-mark">A</div><div><h1>Autonix Admin</h1><p>Secure administration console</p></div></div>
    <form id="adminLogin" method="post" action="/admin/login">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in securely</button>
      <div id="error" class="error" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    document.getElementById('adminLogin').addEventListener('submit', async (event)=>{
      event.preventDefault();
      const form=new FormData(event.currentTarget);
      const button=event.currentTarget.querySelector('button[type="submit"]');
      const error=document.getElementById('error');
      button.disabled=true;
      error.textContent='';
      try{
        const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.get('username'),password:form.get('password')})});
        if(response.ok){location='/admin';return}
        error.textContent=response.status===401?'Invalid username or password.':'Unable to sign in right now. Please try again.';
      }catch{
        error.textContent='Unable to reach the sign-in service. Check your connection and try again.';
      }finally{
        button.disabled=false;
      }
    });
  </script>
</body>
</html>
