<section class="reports-page ad-dashboard-reports" id="dashboard-reports" aria-labelledby="dashboard-reports-title">
  <div class="reports-header">
    <div>
      <span class="ad-eyebrow">TRADING ACTIVITY</span>
      <h2 class="reports-title" id="dashboard-reports-title">Trading reports</h2>
    </div>
  </div>

  <div class="reports-stats-grid">
    <div class="reports-stat-card">
      <span class="reports-stat-label">Total P&amp;L</span>
      <span class="reports-stat-value" id="rpt-total-pl">$0.00</span>
    </div>
    <div class="reports-stat-card">
      <span class="reports-stat-label">Win Rate</span>
      <span class="reports-stat-value accent" id="rpt-win-rate">0.0%</span>
    </div>
    <div class="reports-stat-card">
      <span class="reports-stat-label">Total Trades</span>
      <span class="reports-stat-value" id="rpt-total-trades">0</span>
    </div>
    <div class="reports-stat-card">
      <span class="reports-stat-label">Total Staked</span>
      <span class="reports-stat-value" id="rpt-total-staked">$0.00</span>
    </div>
    <div class="reports-stat-card">
      <span class="reports-stat-label">Wins / Losses</span>
      <span class="reports-stat-value" id="rpt-wins-losses">0 / 0</span>
    </div>
    <div class="reports-stat-card">
      <span class="reports-stat-label">Best Trade</span>
      <span class="reports-stat-value green" id="rpt-best-trade">$0.00</span>
    </div>
  </div>

  <div class="reports-table-wrap">
    <div class="reports-table-header">
      <span>Trade History</span>
      <span class="reports-count" id="rpt-count">0 trades</span>
    </div>
    <div class="reports-table-scroll">
      <table class="reports-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Selection</th>
            <th>Entry</th>
            <th>Exit</th>
            <th>Stake</th>
            <th>P/L</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="reports-tbody">
          <tr class="reports-empty-row">
            <td colspan="7">No trades yet — trade history will appear here when available.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
